name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      run_release:
        description: "Создать черновой релиз даже без тега"
        required: false
        default: "false"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

jobs:

  lint:
    name: Линт (ruff)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установка Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Установка ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Запуск ruff check
        run: ruff check app tests

      - name: Запуск ruff format --check
        run: ruff format --check app tests
        continue-on-error: true

  test:
    name: Тесты (pytest, Python ${{ matrix.python-version }})
    needs: lint
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Установка Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Запуск pytest
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: Agg
          PYTHONUTF8: "1"
          PYTHONHASHSEED: "0"
        run: |
          pytest -q --maxfail=5 --disable-warnings --junitxml=junit-results.xml

      - name: Публикация результатов тестов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: junit-results.xml
          if-no-files-found: warn

  build:
    name: Сборка Windows exe (PyInstaller)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установка Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Определение версии
        id: meta
        shell: pwsh
        run: |
          $ref = "${{ github.ref }}"
          if ($ref.StartsWith("refs/tags/v")) {
            $version = $ref.Substring("refs/tags/v".Length)
          } else {
            $version = "0.1.0+${{ github.run_number }}.$(git rev-parse --short HEAD)"
          }
          "version=$version"          | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "artifact=OSH-Analitik-$version-windows-x64" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Version: $version"

      - name: Сборка PyInstaller
        run: pyinstaller --clean --noconfirm sysan.spec

      - name: Копирование samples и документации в корень дистрибутива
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/OSH-Analitik/samples | Out-Null
          Copy-Item samples/* dist/OSH-Analitik/samples/ -Force
          Copy-Item README.md dist/OSH-Analitik/README.md -Force
          Write-Host "Содержимое dist/OSH-Analitik/:"
          Get-ChildItem dist/OSH-Analitik/ | Select-Object Name, Length

      - name: Дымовой запуск exe (offscreen, корректное завершение)
        env:
          QT_QPA_PLATFORM: offscreen
          SYSAN_SMOKE_EXIT_MS: "3500"
        shell: pwsh
        run: |
          $exe = "dist/OSH-Analitik/OSH-Analitik.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "PyInstaller не собрал $exe"
            exit 1
          }
          Write-Host "Запуск $exe в smoke-режиме (выход через 3.5 c)"
          $proc = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden -NoNewWindow
          if (-not $proc.WaitForExit(20000)) {
            Write-Error "Процесс не завершился за 20 c — таймер smoke-режима не сработал"
            Stop-Process -Id $proc.Id -Force
            exit 1
          }
          if ($proc.ExitCode -ne 0) {
            Write-Error "Smoke-запуск завершился с кодом $($proc.ExitCode)"
            exit 1
          }
          Write-Host "Smoke-запуск ок: код выхода 0"

      - name: Упаковка в ZIP
        shell: pwsh
        run: |
          $name = "${{ steps.meta.outputs.artifact }}"
          Compress-Archive -Path dist/OSH-Analitik/* -DestinationPath "dist/$name.zip" -CompressionLevel Optimal
          Get-ChildItem dist/*.zip | Select-Object Name, @{N='SizeMB';E={[math]::Round($_.Length/1MB,1)}}

      - name: Контрольная сумма SHA256
        shell: pwsh
        run: |
          $name = "${{ steps.meta.outputs.artifact }}"
          Get-FileHash "dist/$name.zip" -Algorithm SHA256 |
            Select-Object Hash, Path |
            Format-List | Out-File "dist/$name.sha256.txt" -Encoding utf8
          Get-Content "dist/$name.sha256.txt"

      - name: Загрузка artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: |
            dist/${{ steps.meta.outputs.artifact }}.zip
            dist/${{ steps.meta.outputs.artifact }}.sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Прикрепление к релизу (только при теге vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/${{ steps.meta.outputs.artifact }}.zip
            dist/${{ steps.meta.outputs.artifact }}.sha256.txt

      - name: Черновой релиз (по запросу из workflow_dispatch)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-${{ github.run_number }}
          name: Nightly build ${{ steps.meta.outputs.version }}
          draft: true
          generate_release_notes: true
          files: |
            dist/${{ steps.meta.outputs.artifact }}.zip
            dist/${{ steps.meta.outputs.artifact }}.sha256.txt
